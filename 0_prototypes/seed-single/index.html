<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed · Hello (single file)</title>
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--line:rgba(231,222,200,.18);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
body{font:14px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;overflow:hidden}
#film,#bar,#hint{width:min(100%,calc((100vh - 120px) * 16 / 9))}
#film{display:block;aspect-ratio:16/9;background:#10201f;border-radius:3px;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px var(--line)}
#bar{display:flex;align-items:center;gap:10px}
button{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{font:12px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px}
html.bare body{padding:0}html.bare #bar,html.bare #hint{display:none}html.bare #film{width:100vw;border-radius:0}
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080" aria-label="Hello: 종이 공 하나가 튀어 들어오고 글자가 한 컷씩 놓인다."></canvas>
<div id="bar">
  <button id="pp">Play</button>
  <input id="scrub" type="range" min="0" max="239" value="0" aria-label="Scrub">
  <span id="tc">0.00 / 4.00</span>
  <button id="sm">Stop-motion</button>
</div>
<p id="hint">Space 재생/정지 · ←→ 한 컷 · S 스톱모션/부드럽게 · ?frame=N 으로 특정 프레임</p>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  SEED · HELLO — 바닐라 스톱모션 필름의 가장 작은 씨앗 (단일 파일)
//  씨앗의 네 가지 약속:
//   1. 필름 규격이 고정되어 있다 (W·H·FPS·DUR). 모든 것은 프레임 번호 f 로 말한다.
//   2. 시뮬레이션은 결정론적이다. 어떤 f 로든 "샷 처음부터 다시 돌려서" 도착한다 → 스크럽이 공짜.
//   3. 샷은 계약을 따르는 객체다: { name, t0, build, reset, step, snap, draw, cam }
//   4. 물리는 매 프레임(60Hz), 카메라에 찍히는 포즈는 EXPO 프레임마다(12포즈/초) = 스톱모션.
// ═══════════════════════════════════════════════════════════════════════════
"use strict";

// ── FILM · 규격 ──────────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 4, NF = FPS * DUR, EXPO = 5;
const TAU = Math.PI * 2;

// ── LIB · 수학, 시드 난수 ────────────────────────────────────────────────────
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const eo = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263) ^ Math.imul((c | 0) + 104729, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
// 보일(boil): 퍼펫을 손으로 다시 놓을 때마다 생기는 미세한 떨림. 노출 번호 e 마다 달라진다.
const boil = (id, e, amt = 1) => [(hash(id, e, 1) - .5) * 3 * amt, (hash(id, e, 2) - .5) * 3 * amt, (hash(id, e, 3) - .5) * .02 * amt];

// ── LIB · 캔버스 ────────────────────────────────────────────────────────────
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
// 스프라이트: 한 번 그려서 구워 두고(bake), 매 프레임은 drawImage 만. (ax, ay) = 앵커
function sprite(w, h, ax, ay, draw, pad = 8) {
  const c = mk(w + pad * 2, h + pad * 2), g = c.getContext('2d');
  g.translate(pad, pad); draw(g);
  return { c, ax: ax + pad, ay: ay + pad };
}
function put(ctx, sp, x, y, rot = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy); ctx.drawImage(sp.c, -sp.ax, -sp.ay); ctx.restore();
}
// 손으로 오린 듯한 원: 반지름을 시드 난수로 살짝 흔든다
function cutCircle(g, cx, cy, r, seed) {
  const R = rng(seed), n = 48, k = []; for (let i = 0; i < 6; i++) k.push(R() * TAU);
  g.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, rr = r * (1 + .018 * Math.sin(a * 3 + k[0]) + .012 * Math.sin(a * 7 + k[1])); i ? g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : g.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  g.closePath();
}

// ═══ SHOT · 샷 계약 ════════════════════════════════════════════════════════
//  build()            한 번: 스프라이트·배경 굽기
//  reset()            샷의 0프레임 상태로 되돌리기 (결정론의 출발점)
//  step(dt, st, sf)   고정 60Hz 물리 한 걸음 (st: 샷 안의 초, sf: 샷 안의 프레임)
//  snap()             지금 상태를 "카메라가 보는 포즈"로 복사 (EXPO 프레임마다 호출)
//  draw(ctx, sq, e)   스냅된 포즈만 그린다 (sq: 포즈의 시각, e: 노출 번호)
//  cam(st)            모션 컨트롤 카메라 {x, y, z} — 이것만은 매 프레임 부드럽게 움직인다
const FLOOR = 900, BR = 70, G = 3000;
const HELLO = {
  name: 'hello', t0: 0,
  build() {
    this.ball = sprite(BR * 2, BR * 2, BR, BR, g => {             // 앵커 = 공 중심 (회전축)
      cutCircle(g, BR, BR, BR, 3); g.fillStyle = '#cf4b40'; g.fill();
      g.save(); g.clip();
      g.fillStyle = 'rgba(60,10,10,.28)'; cutCircle(g, BR + 18, BR + 22, BR, 4); g.fill();          // 아래쪽 그늘
      g.fillStyle = 'rgba(239,232,214,.9)'; g.beginPath(); g.ellipse(BR - 26, BR - 30, 20, 11, -.6, 0, TAU); g.fill(); // 하이라이트
      g.restore();
    });
    this.bg = mk(W, H); const g = this.bg.getContext('2d'), R = rng(5);
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#4f8b92'); gr.addColorStop(1, '#2f6369');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = '#35494e'; g.fillRect(0, FLOOR, W, H - FLOOR);
    g.fillStyle = 'rgba(231,222,200,.25)'; g.fillRect(0, FLOOR, W, 3);
    for (let i = 0; i < 1400; i++) { g.fillStyle = R() < .5 ? 'rgba(236,228,207,.12)' : 'rgba(10,26,30,.14)'; g.fillRect(R() * W, R() * H, 2, 2); } // 먼지
  },
  reset() {
    this.b = { x: 180, y: 260, vx: 420, vy: 0, sq: 1, spin: 0 };
    this.snap();
  },
  step(dt) {
    const b = this.b;
    if (b.hold > 0) {                                                        // 바닥에 닿아 찌그러진 채 잠깐 머문다
      b.hold -= dt; b.x += b.vx * dt; if (b.hold <= 0) b.vy = b.launch;
    } else {
      b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y >= FLOOR) {
        b.y = FLOOR;
        if (b.vy > 160) { b.sq = clamp(1 - b.vy / 5200, .55, 1); b.launch = -b.vy * .66; b.vy = 0; b.vx *= .86; b.hold = .06; } // 튕김 + 찌그러짐
        else { b.vy = 0; b.vx *= Math.exp(-dt * 1.6); }                                                                   // 굴러서 멈춤
      }
      b.sq += (1 - b.sq) * (1 - Math.exp(-dt * 14));
    }
    b.spin += b.vx * dt / BR;
  },
  snap() { const b = this.b; b.rx = b.x; b.ry = b.y; b.rsq = b.sq; b.rspin = b.spin; },
  draw(ctx, sq, e) {
    ctx.drawImage(this.bg, 0, 0);
    const b = this.b, [bx, by, br] = boil(1, e);
    // 그림자: 공이 높을수록 작고 옅다
    const hgt = clamp((FLOOR - b.ry) / 600, 0, 1);
    ctx.fillStyle = `rgba(6,20,24,${.35 - hgt * .2})`; ctx.beginPath(); ctx.ellipse(b.rx + 10, FLOOR + 4, BR * (1.1 - hgt * .4), 12, 0, 0, TAU); ctx.fill();
    // 공: 바닥 앵커 기준으로 찌그러짐 (sx·sy 부피 보존)
    const s = b.rsq; ctx.save(); ctx.translate(b.rx + bx, b.ry + by); ctx.scale(1 / Math.sqrt(s), s);
    put(ctx, this.ball, 0, -BR, b.rspin + br, 1, 1); ctx.restore();
    // 글자: 1.2초부터 한 노출에 한 글자씩 "놓인다"
    const text = 'Hello, world', shown = Math.floor((sq - 1.2) * 12) + 1;
    if (shown > 0) {
      ctx.font = 'italic 150px ui-serif, Georgia, serif'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#efe8d6';
      let x = W / 2 - ctx.measureText(text).width / 2;
      for (let i = 0; i < text.length; i++) {
        const w = ctx.measureText(text[i]).width;
        if (i < shown) { const [lx, ly, lr] = boil(100 + i, e, .8), pop = i === shown - 1 ? 1.08 : 1; ctx.save(); ctx.translate(x + w / 2 + lx, 420 + ly); ctx.rotate(lr); ctx.scale(pop, pop); ctx.fillText(text[i], -w / 2, 0); ctx.restore(); }
        x += w;
      }
    }
  },
  cam(st) { const k = eo(st / DUR); return { x: W / 2 + k * 60, y: H / 2 - k * 20, z: 1 + k * .06 }; },
};
const SHOTS = [HELLO]; // 샷을 늘리려면 t0 를 달리해서 여기에 추가

// ═══ ENGINE · 시계, 스톱모션, 카메라, 재생 ═══════════════════════════════════
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const cv = $('film'), ctx = cv.getContext('2d', { alpha: false });
const film = { f: -1, idx: -1, shot: null, playing: false, smooth: Q.get('smooth') === '1', clock: 0 };

function setCam(c, cam) { c.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z, H / 2 - cam.y * cam.z); }
const shotAt = f => { let i = 0; SHOTS.forEach((s, k) => { if (f >= Math.round(s.t0 * FPS)) i = k; }); return i; };

// 결정론의 심장: 다른 샷이거나 뒤로 가면 reset → 고정 dt 로 f 까지 다시 걷는다
function simTo(f) {
  const i = shotAt(f), s = SHOTS[i], f0 = Math.round(s.t0 * FPS);
  if (i !== film.idx || f < film.f) { film.idx = i; film.shot = s; s.reset(); film.f = f0; }
  while (film.f < f) { film.f++; const sf = film.f - f0; s.step(1 / FPS, sf / FPS, sf); if (film.smooth || sf % EXPO === 0) s.snap(); }
}
function render() {
  const s = film.shot, sf = film.f - Math.round(s.t0 * FPS), st = sf / FPS;
  const e = film.smooth ? 0 : Math.floor(film.f / EXPO);                     // 노출 번호
  const sq = film.smooth ? st : Math.floor(sf / EXPO) * EXPO / FPS;          // 포즈 시각 (on fives)
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0c1719'; ctx.fillRect(0, 0, W, H);
  setCam(ctx, s.cam(st));
  s.draw(ctx, sq, e);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!film.smooth) { const fl = (hash(e, 77) - .5) * .06; ctx.fillStyle = fl > 0 ? `rgba(255,244,226,${fl * .5})` : `rgba(4,14,16,${-fl * .7})`; ctx.fillRect(0, 0, W, H); } // 노출 깜빡임
}

// ── 재생 ──
function seek(f) { simTo(clamp(Math.round(f), 0, NF - 1)); render(); film.clock = film.f / FPS; ui(); }
function play(on = !film.playing) { film.playing = on; if (on && film.f >= NF - 1) seek(0); film.clock = film.f / FPS; ui(); }
let last = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!film.playing) return;
  film.clock = (film.clock + dt) % DUR;                                      // 루프
  const f = clamp(Math.floor(film.clock * FPS), 0, NF - 1);
  if (f !== film.f) { simTo(f); render(); ui(); }
}

// ── UI ──
function ui() {
  $('pp').textContent = film.playing ? 'Pause' : 'Play';
  $('sm').textContent = film.smooth ? 'Smooth · 60/s' : 'Stop-motion · 12/s';
  $('scrub').value = film.f; $('tc').textContent = `${(film.f / FPS).toFixed(2)} / ${DUR.toFixed(2)}`;
}
$('scrub').max = NF - 1;
$('pp').onclick = () => play();
$('sm').onclick = () => { film.smooth = !film.smooth; film.idx = -1; seek(film.f); };
$('scrub').oninput = ev => { play(false); seek(+ev.target.value); };
addEventListener('keydown', ev => {
  if (ev.key === ' ') { ev.preventDefault(); play(); }
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); play(false); const st = film.smooth || ev.shiftKey ? 1 : EXPO, base = st === 1 ? film.f : Math.round(film.f / EXPO) * EXPO; seek(base + (ev.key === 'ArrowRight' ? st : -st)); }
  else if (ev.key === 's' || ev.key === 'S') $('sm').click();
});

// ── boot ──
SHOTS.forEach(s => s.build());
if (Q.get('ui') === '0') document.documentElement.classList.add('bare');
seek(Q.has('frame') ? +Q.get('frame') : Q.has('t') ? +Q.get('t') * FPS : 0);
if (!Q.has('frame') && !Q.has('t')) play(true);
requestAnimationFrame(tick);
// 테스트 훅 (헤드리스 캡처)
window.__film = { seek: f => { seek(f); return film.f; }, info: () => ({ f: film.f, shot: film.shot.name, smooth: film.smooth }) };
</script>
</body>
</html>
