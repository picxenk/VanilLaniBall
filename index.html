<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello, Ball</title>
<!-- ES 모듈이라 file:// 로는 열리지 않는다. 이 폴더에서:  python3 -m http.server 8000  →  http://localhost:8000 -->
<style>
:root{--ground:#0b1517;--ink:#e7dec8;--muted:#8fa4a2;--accent:#d04b40;--gold:#d8a54a;--line:rgba(231,222,200,.18);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink)}
[hidden]{display:none!important}
body{font:14px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;overflow:hidden}
#frame,#bar,#hint{width:min(100%,calc((100vh - 120px) * 16 / 9))}
#frame{position:relative;aspect-ratio:16/9;border-radius:3px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;border:0;border-radius:0;padding:0;color:var(--ink);background:radial-gradient(ellipse at center,rgba(6,14,16,.1),rgba(6,14,16,.62));font:inherit}
#start{cursor:pointer}
.ring{width:80px;height:80px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.tri{border-left:24px solid var(--accent);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:7px}
.name{font:italic clamp(26px,4.5vw,56px) ui-serif,Georgia,serif;margin-top:10px}
.spec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#card .name{color:var(--gold)}
#card button{margin-top:14px}
#bar{display:flex;align-items:center;gap:10px}
button{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#shot{font-size:12px;color:var(--muted);white-space:nowrap}
#track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#fill{height:100%;width:0;background:var(--ink)}#fill.goal{background:var(--gold)}
#tc{font:12px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
#hint{margin:0;color:var(--muted);font-size:12px}
html.bare body{padding:0}html.bare #bar,html.bare #hint{display:none}html.bare #frame{width:100vw;border-radius:0;box-shadow:none}
@media (max-width:720px){#shot,#sm{display:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="film" width="1920" height="1080" aria-label="Hello, Ball: 종이 공 애니메이션처럼 보이는 작은 게임. 공을 톡 쳐서 골대에 넣는다."></canvas>
  <button id="start" class="over" aria-label="Play with sound"><span class="ring"><span class="tri"></span></span><span class="name">Hello, Ball</span><span class="spec">a short film · 3 shots · sound on</span></button>
  <div id="card" class="over" hidden><span class="name">That's a wrap!</span><span class="spec" id="card-spec">3 shots</span><button id="again">Play again</button></div>
</div>
<div id="bar">
  <button id="pp">Play</button>
  <span id="shot">Shot 1/3</span>
  <div id="track"><div id="fill"></div></div>
  <span id="tc">0.00 / 6.00</span>
  <button id="sm">Stop-motion</button>
  <button id="snd">Sound off</button>
</div>
<p id="hint">공을 눌러 톡 · Space 일시정지 · S 스톱모션 · M 음소거</p>
<script type="module" src="./main.js"></script>
</body>
</html>
